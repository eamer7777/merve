<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merve ❤️</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px 20px;
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        max-width: 400px;
        width: 100%;
        position: relative;
        z-index: 10;
        animation: fadeIn 0.8s ease;
    }

    h1, h2 {
        color: #ff2e63;
        margin-bottom: 15px;
    }

    p {
        font-size: 16px;
        color: #444;
        margin-bottom: 15px;
        line-height: 1.5;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: #ff2e63;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        background: #ff0055;
    }

    .heart {
        position: absolute;
        color: #fff;
        font-size: 20px;
        animation: float 6s linear infinite;
    }

    /* Fade Animasyonları */

    .fadeOut {
        animation: fadeOut 0.6s forwards;
    }

    .fadeIn {
        animation: fadeIn 0.6s forwards;
    }

    @keyframes fadeOut {
        to { opacity: 0; transform: scale(0.9); }
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes float {
        from { transform: translateY(100vh); opacity: 1; }
        to { transform: translateY(-10vh); opacity: 0; }
    }
</style>

</head>
<body>

<div class="card" id="mainCard">
    <h1>Merve ❤️</h1>
    <p>
        22 Ağustos 2025'ten beri hayatımın en güzel hikayesini yazıyoruz.  
        İyi ki tanıştık, iyi ki varsın.
    </p>

    <div class="counter" id="loveCounter"></div>

<button onclick="startSurprise()">Sürprizi Aç 🎁</button>

<div id="quizArea" style="margin-top:20px;"></div>


<!-- Arka plan müziği -->
<audio id="bgMusic" loop>
    <source src="wanna-be-yours.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("bgMusic");
let musicStarted = false;

function startSurprise() {

    if (!musicStarted) {
        music.play();
        musicStarted = true;
    }

    const mainCard = document.getElementById("mainCard");
    mainCard.classList.add("fadeOut");

    setTimeout(() => {
        mainCard.innerHTML = `
            <h1>💖</h1>
            <p style="font-weight:bold;">
            Seninle bazı anları tekrar etmek istiyorum...
            </p>
            <button onclick="nextStep()">Devam et</button>
        `;
        mainCard.classList.remove("fadeOut");
        mainCard.classList.add("fadeIn");
    }, 600);
}

function nextStep() {
    const mainCard = document.getElementById("mainCard");
    mainCard.classList.add("fadeOut");

    setTimeout(() => {
        mainCard.innerHTML = `
            <h2>Spotify evimiz? 🎵</h2>

            <button onclick="answer(1)" style="display:block; margin:10px auto;">
            🕋 Kabe
            </button>

            <button onclick="answer(2)" style="display:block; margin:10px auto;">
            🇹🇷 Anıtkabir
            </button>
        `;
        mainCard.classList.remove("fadeOut");
        mainCard.classList.add("fadeIn");
    }, 600);
}

function answer(choice) {
    const mainCard = document.getElementById("mainCard");
    mainCard.classList.add("fadeOut");

    setTimeout(() => {
        if (choice === 1) {
            mainCard.innerHTML = `
                <h2>😌❤️</h2>
                <p>Doğru cevap... Çünkü bizim evimiz kalbimizde.</p>
            `;
        } else {
            mainCard.innerHTML = `
                <h2>😏</h2>
                <p>Hmm… bir daha düşünelim mi?</p>
                <button onclick="nextStep()">Tekrar dene</button>
            `;
        }

        mainCard.classList.remove("fadeOut");
        mainCard.classList.add("fadeIn");
    }, 600);
}
</script>


</body>
</html>
