<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERVEMMM ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    background:white;
    padding:30px 20px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    max-width:420px;
    width:90%;
    text-align:center;
    position:relative;
    animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
    from{opacity:0;transform:scale(0.95)}
    to{opacity:1;transform:scale(1)}
}

.fadeOut{
    animation:fadeOut 0.6s forwards;
}

@keyframes fadeOut{
    to{opacity:0;transform:scale(0.9)}
}

/* PROGRESS BAR */
.progress-wrapper{
    width:100%;
    height:10px;
    background:#ffd1dc;
    border-radius:10px;
    margin-bottom:20px;
    position:relative;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ff2e63;
    border-radius:10px;
    transition:0.6s;
}

.progress-bar.gold{
    background:gold;
    box-shadow:0 0 15px gold, 0 0 30px gold;
}

.progress-heart {
    position: absolute;
    top: 50%; /* Barın dikeyde tam ortasına al */
    transform: translate(-50%, -50%); /* Kendi merkezinden hizala */
    transition: 0.6s; /* Bar ilerlerken yumuşak gitmesini sağlar */
    animation: pulse 1s infinite;
    z-index: 5;
    font-size: 18px;
    pointer-events: none; /* Tıklamalara engel olmasın */
}

@keyframes pulse {
    /* Kalbin merkezini bozmadan büyümesini sağlıyoruz */
    0% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.3); }
    100% { transform: translate(-50%, -50%) scale(1); }
}

/* BUTTONS */
button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    background:#ff2e63;
    color:white;
    font-size:15px;
    cursor:pointer;
    transition:0.3s;
    margin:10px auto;
    display:block;
    width:80%;
}

button:hover{ transform:scale(1.05); }

button.correct{
    box-shadow:0 0 20px gold;
    transform:scale(1.08);
}

/* MEMORIES */
.memories-wrapper{
    margin-top:20px;
    width:100%;
    height: 220px;
    display:flex;
    justify-content:center;
    align-items:center;
    position: relative;
}

.memory-photo{
    max-width:100%;
    max-height:100%;
    border-radius:20px;
    object-fit:cover;
    opacity:0;
    transition:0.8s;
    position:absolute;
}

.memory-photo.active{
    opacity:1;
}

/* ENVELOPE & LETTER ANIMATION */
.envelope-wrapper {
    margin-top: 50px;
    position: relative;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.envelope {
    width: 180px;
    height: 120px;
    background: #ff4f81;
    border-radius: 0 0 10px 10px;
    position: relative;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.4s ease;
}

/* Zarf Kapağı */
.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #ff6f9c;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transition: transform 0.6s ease;
    transform-origin: top;
    z-index: 12;
}

.envelope.open::before {
    transform: rotateX(180deg);
}

/* Sallanma Efekti */
@keyframes shake {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
    75% { transform: rotate(-5deg); }
    100% { transform: rotate(0deg); }
}

.envelope.shake {
    animation: shake 0.3s ease-in-out;
}

/* Mektup Kağıdı */
.letter {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%) scale(0.9);
    width: 160px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    font-family: 'Dancing Script', cursive;
    font-size: 16px;
    line-height: 1.4;
    color: #ff2e63;
    opacity: 0;
    transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 5;
    text-align: center;
}

.letter.show {
    opacity: 1;
    bottom: 80px; /* Zarftan yukarı çıkar */
    width: 280px; /* Açılınca genişler */
    transform: translateX(-50%) scale(1);
    z-index: 15;
}

/* HEART RAIN */
.falling-heart{
    position:fixed;
    top:-20px;
    font-size:20px;
    animation:fall 4s linear forwards;
    pointer-events:none;
    z-index:999;
}

@keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); opacity:0; }
}
</style>
</head>

<body>

<div class="card" id="mainCard">
    <h1>mervemm ❤️</h1>
    <p>22 Ağustos'tan beri hayatımın en güzel hikayesisin askim benim</p>
    <button onclick="startSurprise()">Sürprizi aç 🎁</button>
</div>

<audio id="music" loop>
    <source src="wanna-be-yours.mp3" type="audio/mpeg">
</audio>

<script>
const card = document.getElementById("mainCard");
const music = document.getElementById("music");

function setProgress(percent){
    let goldClass = percent === 100 ? "gold" : "";
    return `
    <div class="progress-wrapper">
        <div class="progress-bar ${goldClass}" style="width:${percent}%"></div>
        <div class="progress-heart" style="left:${percent}%">❤️</div>
    </div>`;
}

function startSurprise(){
    card.classList.add("fadeOut");
    music.play().catch(e => console.log("Müzik otomatik başlatılamadı, etkileşim gerekiyor."));

    setTimeout(()=>{
        card.innerHTML=
        setProgress(20)+
        `<h3>Spotify evimiz? 🎵</h3>
        <button onclick="q1(this)">🇹🇷 Anıtkabir</button>
        <button onclick="wrong()">🕋 Kabe :D</button>`;
        card.classList.remove("fadeOut");
    },600);
}

function q1(btn){
    btn.classList.add("correct");
    setTimeout(()=>{
        card.innerHTML=
        setProgress(40)+
        `<h3>ZEKİ OLDUĞUNU BİLİYORDUM SEVGİLİMMMM</h3>
        <h3>tanışma sebebimiz?</h3>
        <button onclick="wrong()">👾Discord</button>
        <button onclick="q2(this)">👩‍❤️‍👨 couple pp tacizim EWIQGEYQWIYRFQWE</button>`;
    },800);
}

function q2(btn){
    btn.classList.add("correct");
    setTimeout(memories,800);
}

function wrong(){ alert("Tekrar dene sevgilimmmm"); }

let index=0;
function memories(){
    card.innerHTML=
    setProgress(70)+
    `<h3>bazı anılarımızzz askimm☆*: .｡. o(≧▽≦)o .｡.:*☆</h3>
    <div class="memories-wrapper">
        <img src="foto1.jpg" class="memory-photo">
        <img src="foto2.jpg" class="memory-photo">
        <img src="foto3.jpg" class="memory-photo">
    </div>`;

    const photos=document.querySelectorAll(".memory-photo");
    function showNext(){
        photos.forEach(p=>p.classList.remove("active"));
        if(index < photos.length){
            photos[index].classList.add("active");
            index++;
            setTimeout(showNext, 2500);
        } else {
            setTimeout(showEnvelope, 1000);
        }
    }
    showNext();
}

function showEnvelope(){
    card.innerHTML=
    setProgress(100)+
    `<h3>Son bir şey var... 💌</h3>
    <div class="envelope-wrapper">
        <div class="envelope" id="env" onclick="handleEnvelopeClick()"></div>
        <div class="letter" id="letter">
            Canım sevgilim beniiimmm ❤️<br><br>
            Sen benim en huzurlu yerimsin askiimm ❤️❤️
            Seninle gülmek, seninle susmak,
            seninle hayal kurmak benim en huzurlu anlarimmaskiimmm╰(*°▽°*)╯<br><br>
            İyi ki sen.<br>
            İyi ki biz.<br>
            ALWAYS FOREVEERRRRR 💖
        </div>
    </div>
    <p id="hintText" style="margin-top:20px;font-size:13px;color:#777">
        (Zarfı açmak için 3 kez bas)
    </p>`;
}

let clickCount = 0;
function handleEnvelopeClick() {
    const env = document.getElementById("env");
    const letter = document.getElementById("letter");
    const hintText = document.getElementById("hintText");

    clickCount++;

    if (clickCount < 3) {
        // Sallanma efekti ekle ve kaldır
        env.classList.add("shake");
        setTimeout(() => env.classList.remove("shake"), 300);
    } else {
        // Zarfı aç ve mektubu göster
        env.classList.add("open");
        hintText.style.display = "none";
        
        setTimeout(() => {
            letter.classList.add("show");
            startInfiniteHearts();
        }, 600);
    }
}

function startInfiniteHearts(){
    setInterval(()=>{
        const heart=document.createElement("div");
        heart.classList.add("falling-heart");
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration=(3+Math.random()*2)+"s";
        heart.style.fontSize=(16+Math.random()*20)+"px";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),5000);
    },300);
}
</script>

</body>
</html>
