<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merve ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;
text-align:center;
overflow:hidden;
padding:20px;
}

.card{
background:rgba(255,255,255,0.95);
padding:30px 20px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
max-width:420px;
width:100%;
position:relative;
}

/* PROGRESS BAR */

.progress-wrapper{
width:100%;
height:10px;
background:#ffd1dc;
border-radius:10px;
margin-bottom:20px;
position:relative;
overflow:visible;
}

.progress-bar{
height:100%;
width:0%;
background:#ff2e63;
border-radius:10px;
transition:width 0.6s ease;
}

.progress-heart{
position:absolute;
top:-18px;
font-size:20px;
transition:left 0.6s ease;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* BUTTON */

button{
padding:12px 25px;
border:none;
border-radius:25px;
background:#ff2e63;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
margin:8px auto;
display:block;
width:80%;
}

button:hover{
transform:scale(1.05);
background:#ff0055;
}

button.correct{
box-shadow:0 0 20px gold;
transform:scale(1.08);
}

/* MEMORIES */

.memories-wrapper{
position:relative;
width:100%;
height:240px;
margin-top:20px;
border-radius:20px;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
}

.memory-photo{
position:absolute;
width:100%;
height:100%;
object-fit:cover;
border-radius:20px;
opacity:0;
transition:opacity 0.8s ease, transform 0.8s ease;
transform:scale(1.05);
}

.memory-photo.active{
opacity:1;
transform:scale(1);
}

/* ENVELOPE */

.envelope-wrapper{
margin-top:30px;
display:flex;
flex-direction:column;
align-items:center;
}

.envelope{
width:180px;
height:120px;
background:#ff4f81;
border-radius:10px;
position:relative;
cursor:pointer;
transition:transform 0.3s ease;
}

.envelope.shake{
animation:shake 0.3s;
}

@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-5px)}
50%{transform:translateX(5px)}
75%{transform:translateX(-5px)}
100%{transform:translateX(0)}
}

.envelope::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:60px;
background:#ff6f9c;
clip-path:polygon(0 0,100% 0,50% 100%);
transition:transform 0.6s ease;
transform-origin:top;
}

.envelope.open::before{
transform:rotateX(180deg);
}

.letter{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%) translateY(100%);
width:85%;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
transition:transform 0.8s ease;
font-family:'Dancing Script',cursive;
font-size:18px;
line-height:1.8;
color:#ff2e63;
}

.envelope.open .letter{
transform:translateX(-50%) translateY(-130%);
}

/* FALLING HEARTS */

.falling-heart{
position:fixed;
top:-20px;
font-size:20px;
animation:fall 4s linear forwards;
pointer-events:none;
z-index:999;
filter:drop-shadow(0 0 6px #ff4f81);
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card" id="mainCard">

<div class="progress-wrapper">
<div class="progress-bar" id="progressBar"></div>
<div class="progress-heart" id="progressHeart">❤️</div>
</div>

<h1>Merve ❤️</h1>
<p>22 Ağustos 2025'ten beri hayatımın en güzel hikayesi...</p>
<button onclick="startSurprise()">Sürprizi Aç 🎁</button>

</div>

<audio id="bgMusic" autoplay loop>
<source src="wanna-be-yours.mp3" type="audio/mpeg">
</audio>

<script>
const mainCard=document.getElementById("mainCard");
const progressBar=document.getElementById("progressBar");
const progressHeart=document.getElementById("progressHeart");

function updateProgress(percent){
progressBar.style.width=percent+"%";
progressHeart.style.left="calc("+percent+"% - 10px)";
}

/* QUIZ START */

function startSurprise(){
updateProgress(20);
mainCard.innerHTML+=`<h3>Spotify evimiz? 🎵</h3>
<button onclick="q1(this)">🇹🇷 Anıtkabir</button>
<button onclick="wrong()">🕋 Kabe</button>`;
}

function q1(btn){
btn.classList.add("correct");
updateProgress(40);
setTimeout(()=>{
mainCard.innerHTML=`<div class="progress-wrapper">
<div class="progress-bar" style="width:40%"></div>
<div class="progress-heart" style="left:calc(40% - 10px)">❤️</div>
</div>
<h3>ZEKI OLDUGUNU BILIYODUM SEVGILIM 😌</h3>
<h3>Tanışma sebebimiz?</h3>
<button onclick="wrong()">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="18"> Discord
</button>
<button onclick="q2(this)">👩‍❤️‍👨 Couple pp</button>`;
},800);
}

function q2(btn){
btn.classList.add("correct");
updateProgress(60);
setTimeout(memories,1000);
}

function wrong(){
alert("Tekrar dene 😌");
}

/* MEMORIES */

let photoIndex=0;

function memories(){
updateProgress(80);
mainCard.innerHTML=`
<div class="progress-wrapper">
<div class="progress-bar" style="width:80%"></div>
<div class="progress-heart" style="left:calc(80% - 10px)">❤️</div>
</div>
<h3>Bazı anılarımız 💕</h3>
<div class="memories-wrapper">
<img src="foto1.jpg" class="memory-photo">
<img src="foto2.jpg" class="memory-photo">
<img src="foto3.jpg" class="memory-photo">
</div>
`;

const photos=document.querySelectorAll(".memory-photo");

function nextPhoto(){
photos.forEach(p=>p.classList.remove("active"));
if(photoIndex<photos.length){
photos[photoIndex].classList.add("active");
photoIndex++;
setTimeout(nextPhoto,2500);
}else{
setTimeout(showEnvelope,2000);
}
}

nextPhoto();
}

/* ENVELOPE */

function showEnvelope(){
updateProgress(100);
mainCard.innerHTML=`
<div class="progress-wrapper">
<div class="progress-bar" style="width:100%"></div>
<div class="progress-heart" style="left:calc(100% - 10px)">❤️</div>
</div>
<h3>Son bir şey var... 💌</h3>
<div class="envelope-wrapper">
<div class="envelope" id="envelope" onclick="openEnvelope()">
<div class="letter">
Merve ❤️<br><br>
Sen benim en huzurlu yerimsin.
Seninle gülmek, seninle susmak,
seninle hayal kurmak...
Hepsi bir mucize gibi.<br><br>
İyi ki sen.
İyi ki biz.
Sonsuza kadar. 💖
</div>
</div>
<p>(Zarfı açmak için birkaç kez tıkla)</p>
</div>`;
}

let clickCount=0;

function openEnvelope(){
const env=document.getElementById("envelope");
clickCount++;
env.classList.add("shake");
setTimeout(()=>env.classList.remove("shake"),300);
if(clickCount>=3){
env.classList.add("open");
releaseHearts();
}
}

/* HEART RAIN */

function releaseHearts(){
for(let i=0;i<25;i++){
const heart=document.createElement("div");
heart.classList.add("falling-heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*2)+"s";
heart.style.fontSize=(16+Math.random()*20)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
}
}
</script>

</body>
</html>
