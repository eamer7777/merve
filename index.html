<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sevgilim 💖</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#ff6f91;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    color:white;
    text-align:center;
}

/* ===== GENEL KART ===== */
.card{
    background:white;
    color:black;
    padding:30px;
    border-radius:20px;
    width:90%;
    max-width:400px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s forwards;
}

/* ===== BUTON ===== */
button{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    font-size:16px;
    background:linear-gradient(45deg,#ff2e63,#ff7aa2);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
    box-shadow:0 0 15px #ff2e63;
}

/* ===== PROGRESS BAR ===== */
.progress-wrapper{
    position:absolute;
    top:40px;
    width:80%;
    max-width:400px;
}

.progress{
    height:8px;
    background:#ffd1dc;
    border-radius:10px;
    overflow:visible;
    position:relative;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#ff2e63;
    border-radius:10px;
    transition:width 0.6s;
}

.heart{
    position:absolute;
    top:-15px;
    right:-15px;
    font-size:22px;
    animation:beat 1s infinite;
}

@keyframes beat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.3);}
}

/* ===== FOTOĞRAF ANIMASYON ===== */
.photo{
    width:100%;
    border-radius:15px;
    margin-top:15px;
    animation:fadeInUp 1s forwards;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

@keyframes fadeInUp{
    from{opacity:0; transform:translateY(40px)}
    to{opacity:1; transform:translateY(0)}
}

/* ===== ZARF ===== */
.envelope{
    width:120px;
    height:80px;
    background:white;
    position:relative;
    margin:20px auto;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.envelope:before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:#ffd1dc;
    clip-path:polygon(0 0,100% 0,50% 50%);
}

.shake{
    animation:shake 0.4s;
}

@keyframes shake{
    0%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-5px)}
    100%{transform:translateX(0)}
}

.letter{
    background:white;
    color:black;
    padding:20px;
    border-radius:15px;
    animation:fadeIn 1s forwards;
}

</style>
</head>

<body>

<audio id="music" src="wanna-be-yours.mp3" loop></audio>

<div class="progress-wrapper">
    <div class="progress">
        <div class="progress-bar" id="bar"></div>
        <div class="heart">💖</div>
    </div>
</div>

<div id="content" class="card">
    <h2>Seninle bazı anları tekrar etmek istiyorum 💕</h2>
    <button onclick="start()">Devam Et</button>
</div>

<script>

let step=0;
let daysTogether = Math.floor((new Date() - new Date("2024-01-01")) / (1000*60*60*24));
let envelopeClicks=0;

function start(){
    document.getElementById("music").play();
    next();
}

function next(){
    step++;
    updateBar();

    const content=document.getElementById("content");

    if(step==1){
        content.innerHTML=`
        <h2>${daysTogether} gündür birlikteyiz 💖</h2>
        <button onclick="next()">Devam</button>
        `;
    }

    else if(step==2){
        content.innerHTML=`
        <h2>Bazı anılarımız 💕</h2>
        <img src="foto1.jpg" class="photo">
        `;
        setTimeout(()=>{content.innerHTML+=`<img src="foto2.jpg" class="photo">`},2000);
        setTimeout(()=>{content.innerHTML+=`<img src="foto3.jpg" class="photo">`},4000);
        setTimeout(()=>{content.innerHTML+=`<button onclick="next()">Devam</button>`},6000);
    }

    else if(step==3){
        content.innerHTML=`
        <div class="envelope" id="env" onclick="openEnvelope()"></div>
        <p>Zarfı açmak için tıkla 💌</p>
        `;
    }

}

function updateBar(){
    document.getElementById("bar").style.width=(step*33)+"%";
}

function openEnvelope(){
    envelopeClicks++;
    const env=document.getElementById("env");

    if(envelopeClicks<3){
        env.classList.add("shake");
        setTimeout(()=>env.classList.remove("shake"),400);
    }else{
        document.getElementById("content").innerHTML=`
        <div class="letter">
        Hayatımın en güzel tesadüfü sensin.  
        Seninle geçen her günüm, kalbimin en güzel melodisi gibi.  
        İyi ki varsın. İyi ki benimlesin. 💖  
        Sonsuza kadar sen.
        </div>
        `;
        document.getElementById("bar").style.width="100%";
    }
}

</script>

</body>
</html>
