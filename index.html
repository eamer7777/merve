<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merve ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
height:100vh;
background:linear-gradient(135deg,#ff758c,#ff7eb3);
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
background:white;
padding:30px 20px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
max-width:420px;
width:100%;
text-align:center;
position:relative;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:scale(0.95)}
to{opacity:1;transform:scale(1)}
}

.fadeOut{
animation:fadeOut 0.6s forwards;
}

@keyframes fadeOut{
to{opacity:0;transform:scale(0.9)}
}

/* PROGRESS */

.progress-wrapper{
width:100%;
height:10px;
background:#ffd1dc;
border-radius:10px;
margin-bottom:20px;
position:relative;
}

.progress-bar{
height:100%;
width:0%;
background:#ff2e63;
border-radius:10px;
transition:0.6s;
}

.progress-heart{
position:absolute;
top:-18px;
left:0%;
transition:0.6s;
animation:pulse 1s infinite;
}

@keyframes pulse{
0%{transform:scale(1)}
50%{transform:scale(1.2)}
100%{transform:scale(1)}
}

/* BUTTON */

button{
padding:12px 25px;
border:none;
border-radius:25px;
background:#ff2e63;
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
margin:10px auto;
display:block;
width:80%;
}

button:hover{
transform:scale(1.05);
}

button.correct{
box-shadow:0 0 20px gold;
transform:scale(1.08);
}

/* MEMORIES */

.memories-wrapper{
margin-top:20px;
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.memory-photo{
max-width:100%;
max-height:220px;
border-radius:20px;
object-fit:contain;
opacity:0;
transition:0.8s;
position:absolute;
}

.memory-photo.active{
opacity:1;
position:relative;
}

/* ENVELOPE */

.envelope-wrapper{
margin-top:30px;
position:relative;
height:220px;
}

.envelope{
width:180px;
height:120px;
background:#ff4f81;
border-radius:10px;
position:absolute;
left:50%;
transform:translateX(-50%);
cursor:pointer;
transition:0.5s;
}

.envelope::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:60px;
background:#ff6f9c;
clip-path:polygon(0 0,100% 0,50% 100%);
transition:0.6s;
transform-origin:top;
}

.envelope.open::before{
transform:rotateX(180deg);
}

.envelope.open{
transform:translateX(-50%) scale(0.7);
opacity:0.6;
}

.letter{
position:absolute;
left:50%;
top:40%;
transform:translate(-50%,-50%) scale(0);
width:85%;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,0.3);
font-family:'Dancing Script',cursive;
font-size:20px;
line-height:1.8;
color:#ff2e63;
transition:0.8s;
z-index:5;
}

.letter.show{
transform:translate(-50%,-50%) scale(1);
}

/* HEART RAIN */

.falling-heart{
position:fixed;
top:-20px;
font-size:20px;
animation:fall 4s linear forwards;
pointer-events:none;
z-index:999;
filter:drop-shadow(0 0 8px #ff4f81);
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card" id="mainCard">

<h1>Merve ❤️</h1>
<p>22 Ağustos 2025'ten beri hayatımın en güzel hikayesi...</p>
<button onclick="startSurprise()">Sürprizi Aç 🎁</button>

</div>

<audio id="music" loop>
<source src="wanna.mp3" type="audio/mpeg">
</audio>

<script>
const card=document.getElementById("mainCard");
const music=document.getElementById("music");

function setProgress(percent){
return `
<div class="progress-wrapper">
<div class="progress-bar" style="width:${percent}%"></div>
<div class="progress-heart" style="left:${percent}%">❤️</div>
</div>`;
}

/* START */

function startSurprise(){
card.classList.add("fadeOut");
music.play();

setTimeout(()=>{
card.innerHTML=
setProgress(20)+
`<h3>Spotify evimiz? 🎵</h3>
<button onclick="q1(this)">🇹🇷 Anıtkabir</button>
<button onclick="wrong()">🕋 Kabe</button>`;
card.classList.remove("fadeOut");
},600);
}

/* QUIZ */

function q1(btn){
btn.classList.add("correct");
setTimeout(()=>{
card.innerHTML=
setProgress(40)+
`<h3>ZEKI OLDUGUNU BILIYODUM SEVGILIM 😌</h3>
<h3>Tanışma sebebimiz?</h3>
<button onclick="wrong()">
<img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png" width="18"> Discord
</button>
<button onclick="q2(this)">👩‍❤️‍👨 Couple pp</button>`;
},800);
}

function q2(btn){
btn.classList.add("correct");
setTimeout(memories,800);
}

function wrong(){
alert("Tekrar dene 😌");
}

/* MEMORIES */

let index=0;

function memories(){
card.innerHTML=
setProgress(70)+
`<h3>Bazı anılarımız 💕</h3>
<div class="memories-wrapper">
<img src="foto1.jpg" class="memory-photo">
<img src="foto2.jpg" class="memory-photo">
<img src="foto3.jpg" class="memory-photo">
</div>`;

const photos=document.querySelectorAll(".memory-photo");

function showNext(){
photos.forEach(p=>p.classList.remove("active"));
if(index<photos.length){
photos[index].classList.add("active");
index++;
setTimeout(showNext,2500);
}else{
setTimeout(showEnvelope,2000);
}
}

showNext();
}

/* ENVELOPE */

function showEnvelope(){
card.innerHTML=
setProgress(100)+
`<h3>Son bir şey var... 💌</h3>
<div class="envelope-wrapper">
<div class="envelope" id="env" onclick="openEnvelope()"></div>
<div class="letter" id="letter">
Merve ❤️<br><br>
Sen benim en huzurlu yerimsin.
Seninle gülmek, seninle susmak,
seninle hayal kurmak...
Hepsi bir mucize gibi.<br><br>
İyi ki sen.
İyi ki biz.
Sonsuza kadar. 💖
</div>
<p style="margin-top:150px;font-size:13px;color:#777">
(Zarfı açmak için birkaç kez tıkla)
</p>
</div>`;
}

let clickCount=0;

function openEnvelope(){
const env=document.getElementById("env");
const letter=document.getElementById("letter");
clickCount++;

env.classList.add("shake");

if(clickCount>=3){
env.classList.add("open");
letter.classList.add("show");
releaseHearts();
}
}

/* HEARTS */

function releaseHearts(){
for(let i=0;i<30;i++){
const heart=document.createElement("div");
heart.classList.add("falling-heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*2)+"s";
heart.style.fontSize=(16+Math.random()*20)+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),5000);
}
}
</script>

</body>
</html>
