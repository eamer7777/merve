<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merve ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#ff6f91,#ff8fab);
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* ORTALI PROGRESS BAR */

.fixed-progress{
    position:fixed;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    width:260px;
    height:12px;
    background:#ffd6e0;
    border-radius:20px;
    z-index:999;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff2e63,#ff8fab);
    border-radius:20px;
    transition:0.5s;
    box-shadow:0 0 15px #ff4d88;
}

.progress-heart{
    position:absolute;
    top:-22px; /* BARIN DIŞINDA */
    left:0%;
    transform:translateX(-50%);
    font-size:20px;
    animation:heartbeat 1s infinite;
    transition:0.5s;
}

@keyframes heartbeat{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.3);}
}

/* ALTIN FINAL EFEKTİ */

.gold{
    background:linear-gradient(90deg,#FFD700,#FFC300);
    box-shadow:0 0 25px gold;
}

/* CARD */

.card{
    background:rgba(255,255,255,0.95);
    padding:30px 20px;
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    max-width:400px;
    width:100%;
}

/* BUTTON */

button{
    padding:14px 25px;
    border:none;
    border-radius:40px;
    background:linear-gradient(90deg,#ff2e63,#ff8fab);
    color:white;
    font-size:15px;
    cursor:pointer;
    margin:10px 0;
    width:100%;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

button.selected{
    box-shadow:0 0 25px #ff2e63;
    transform:scale(1.08);
}
    @keyframes fadeInRecap{
    from{opacity:0;transform:scale(1.05);}
    to{opacity:1;transform:scale(1);}
}

</style>
</head>

<body>

<!-- ORTADA SABİT BAR -->
<div class="fixed-progress">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-heart" id="progressHeart">❤️</div>
</div>

<div class="card" id="mainCard">
    <h1>Merve ❤️</h1>
    <p>22 Ağustos 2025'ten beri hayatımın en güzel hikayesini yazıyoruz.</p>
    <button onclick="startSurprise()">Sürprizi Aç 🎁</button>
</div>

<audio id="bgMusic" loop>
    <source src="wanna-be-yours.mp3" type="audio/mpeg">
</audio>

<script>
const music=document.getElementById("bgMusic");
let musicStarted=false;

function updateProgress(percent){
    const bar=document.getElementById("progressBar");
    const heart=document.getElementById("progressHeart");

    bar.style.width=percent+"%";
    heart.style.left=percent+"%";

    if(percent===100){
        bar.classList.add("gold");
    }
}

function startSurprise(){
    if(!musicStarted){
        music.play().catch(()=>{});
        musicStarted=true;
    }

    const card=document.getElementById("mainCard");
    card.innerHTML=`
        <p><b>Seninle bazı anları tekrar etmek istiyorum...</b></p>
        <button onclick="question1()">Devam et</button>
    `;
    updateProgress(10);
}

function question1(){
    const card=document.getElementById("mainCard");
    card.innerHTML=`
        <h2>Spotify evimiz? 🎵</h2>
        <button onclick="answer1(this,1)">🕋 Kabe</button>
        <button onclick="answer1(this,2)">🇹🇷 Anıtkabir</button>
    `;
    updateProgress(30);
}

function answer1(btn,choice){
    btn.classList.add("selected");
    if(choice===2){
        setTimeout(()=>{
            updateProgress(60);
            question2();
        },800);
    }
}

function question2(){
    const card=document.getElementById("mainCard");
    card.innerHTML=`
        <h2>Tanışma sebebimiz?</h2>

        <button onclick="answer2(this,1)">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"
                 width="18"
                 style="vertical-align:middle;margin-right:6px;">
            Discord
        </button>

        <button onclick="answer2(this,2)">
            👩‍❤️‍👨 Couple PP
        </button>
    `;
    updateProgress(60);
}

function answer2(btn,choice){
    btn.classList.add("selected");
    if(choice===2){
        setTimeout(()=>{
            updateProgress(100);
            finalScreen();
        },800);
    }
}

function finalScreen(){
    updateProgress(100);

    const card=document.getElementById("mainCard");
    card.innerHTML=`
        <h2>ZEKİ OLDUĞUNU BİLİYODUM SEVGİLİM 💖</h2>
        <button onclick="showRecap()">Bir şey daha var...</button>
    `;
}
function showRecap(){
    document.body.innerHTML = `
        <div id="recap" style="
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            color:white;
            font-family:sans-serif;
            background:linear-gradient(45deg,#1DB954,#191414);
            animation:fadeInRecap 1s ease;
        ">
            <h1 style="font-size:28px;margin-bottom:20px;">
                Bizim Hikayemiz 🎵
            </h1>

            <h2 style="font-size:20px;margin-bottom:10px;">
                22 Ağustos 2025'ten beri
            </h2>

            <div id="loveTimer" style="
                font-size:32px;
                font-weight:bold;
                margin-top:20px;
            ">
            </div>

            <p style="margin-top:20px;font-size:18px;">
                birlikteyiz 💖
            </p>
        </div>
    `;

    startLoveTimer();
}
function startLoveTimer(){
    const startDate = new Date("2025-08-22T00:00:00");

    function update(){
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(diff / (1000*60*60*24));
        const hours = Math.floor((diff / (1000*60*60)) % 24);
        const minutes = Math.floor((diff / (1000*60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("loveTimer").innerHTML =
            days + " gün " +
            hours + " saat " +
            minutes + " dakika " +
            seconds + " saniye";
    }

    update();
    setInterval(update,1000);
}

</script>

</body>
</html>
